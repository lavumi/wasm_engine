<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>


<style>
    @font-face {
        font-family: 'Helltaker';
        src: url('assets/font/ThereBart.ttf');
    }

    .github-button {
        display: block;
        width: 200px;
        margin: 20px auto;
        background-color: #4a0000;
        color: antiquewhite;
        border: 2px solid #ff0000;
        padding: 10px 20px;
        font-family: 'Helltaker', sans-serif;
        font-size: 20px;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        transition: all 0.3s ease;
    }

    .github-button:hover {
        background-color: #ff0000;
        transform: scale(1.05);
    }

    .description {
        font-family: Arial, sans-serif;
        color: antiquewhite;
        text-align: center;
        max-width: 800px;
        margin: 20px auto;
        font-size: 18px;
        line-height: 1.5;
        padding: 0 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .title {
        font-family: Helltaker;
        color: antiquewhite;
        font-size: 100px;
        text-align: center;
        margin-bottom: 10px;
    }
</style>
<body style="background-color: black">

<div class="title">HELLTAKER</div>


<canvas id="canvas" oncontextmenu="event.preventDefault()"
        style="padding: 0; margin: auto; display: block; width: 1024px">
</canvas>
<div class="description">
    Watch Helltaker characters dance in the spotlight while enjoying the iconic soundtrack.
</div>
<a href="https://github.com/lavumi/wasm_engine" target="_blank" class="github-button">GitHub</a>

<script type='text/javascript'>
    var canv = document.getElementById('canvas');
    var Module = {
        canvas: canv
    };
    Module['locateFile'] = function(path, prefix) {
        if (path.endsWith(".data")) return "assets/wasm/" + path;

        return prefix + path;
    }
</script>
<script src="assets/wasm/wasm.js">


</script>
<script type='text/javascript'>
    canv.addEventListener('mousedown', __mouseLeftDown, false);
    canv.addEventListener('mouseup', __mouseLeftUp, false);

    canv.addEventListener('touchend', __mouseLeftUp, false);
    window.addEventListener('keydown', function (e) {

        __keyboardDown( e.keyCode );
    });

    window.addEventListener('keyup', function (e) {
        if( e.key === 'f'){
            return canv.webkitRequestFullScreen();
        }
        __keyboardUp(e.keyCode );
    });

    canv.addEventListener('mousemove', function(e){
        __mouseMove(e.movementX, e.movementY);
    })
</script>

</body>
<footer style="zoom: 1; position: fixed; left: 0; bottom: 0; width: 100%;  text-align: center;">
    <audio controls>
        <source src="assets/bgm/helltaker.mp3" type="audio/mpeg" />
    </audio>
</footer>
</html>
